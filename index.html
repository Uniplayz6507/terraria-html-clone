<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Terraforge</title>
<style>
:root{color-scheme:dark;--ink:#eaf4ff;--panel:#101a2be8;--line:#8fc8ff55}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#08111f;color:var(--ink);font:14px system-ui,Segoe UI,sans-serif}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;gap:12px;padding:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px #0006;backdrop-filter:blur(5px);padding:10px 12px}.title{font-weight:800;letter-spacing:.08em;color:#a9dcff}.stats{display:flex;gap:10px;align-items:center}.bar{width:112px;height:8px;background:#12243a;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#ff5e78}.bar.mana i{background:#58a8ff}.tip{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);text-align:center;opacity:.82}.hotbar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:5px}.slot{width:54px;height:54px;border:1px solid #9bcfff55;background:#0d1828dd;border-radius:8px;display:grid;place-items:center;position:relative;font-size:25px}.slot.sel{border:2px solid #ffe07c;box-shadow:0 0 16px #ffe07c66}.slot b{position:absolute;bottom:2px;right:5px;font-size:11px;color:#fff}.help{position:absolute;right:14px;bottom:14px;max-width:230px;line-height:1.45}.toast{position:absolute;top:82px;left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:99px;background:#081525dd;opacity:0;transition:.2s}.toast.show{opacity:1}
</style>
</head>
<body><canvas id="game"></canvas><div class="hud"><div class="top"><div class="card"><div class="title">TERRAFORGE</div><small>an original browser sandbox</small></div><div class="card stats"><span>❤</span><div class="bar"><i id="hp"></i></div><span>✦</span><div class="bar mana"><i id="mp"></i></div><span id="clock">DAY 1 · 08:00</span></div></div><div id="toast" class="toast"></div><div class="tip">WASD / arrows move · mouse mine/place · 1-5 select · E craft</div><div id="hotbar" class="hotbar"></div><div class="card help"><b>FIELD NOTES</b><br>Blue crystal grows deep underground.<br>Slimes are harmless-ish. Find iron, craft a blade, explore.</div></div>
<script>
'use strict';
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),W=80,H=38,T=32;let dpr=1,world=[],particles=[],slimes=[],keys={},mouse={x:0,y:0,down:false,button:0},cam={x:0,y:0},time=0,selected=0,toastTimer=0;
const types={air:{solid:false},grass:{solid:true,color:'#50a966',top:'#8ddc72'},dirt:{solid:true,color:'#86553e'},stone:{solid:true,color:'#53647b'},wood:{solid:true,color:'#a8734e'},leaf:{solid:true,color:'#3a9b61'},copper:{solid:true,color:'#c7805c'},crystal:{solid:true,color:'#59d6e8'},workbench:{solid:true,color:'#bb814f'}};
const items=[{id:'pick',name:'Pick',icon:'⛏️',count:1},{id:'dirt',name:'Dirt',icon:'🟫',count:30},{id:'stone',name:'Stone',icon:'⬛',count:0},{id:'wood',name:'Wood',icon:'🪵',count:12},{id:'workbench',name:'Bench',icon:'🛠️',count:1}];
function resize(){dpr=Math.min(2,devicePixelRatio||1);c.width=innerWidth*dpr;c.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function noise(x){let n=Math.sin(x*12.9898)*43758.5453;return n-Math.floor(n)}
function makeWorld(){world=Array.from({length:H},()=>Array(W).fill('air'));for(let x=0;x<W;x++){let surface=13+Math.floor(Math.sin(x*.23)*2+noise(x)*2);for(let y=surface;y<H;y++){world[y][x]=y===surface?'grass':y<surface+4?'dirt':y>H-7&&noise(x+y)>.72?'crystal':noise(x*3+y)>.79?'copper':'stone'}}for(let x=3;x<W-3;x+=3+Math.floor(noise(x)*4)){let s=13+Math.floor(Math.sin(x*.23)*2+noise(x)*2);if(noise(x*4)>.43){for(let y=s-1;y>s-5;y--)if(y>0)world[y][x]='wood';for(let yy=s-5;yy<s-2;yy++)for(let xx=x-2;xx<=x+2;xx++)if(xx>0&&xx<W&&noise(xx+yy)>.2)world[yy][xx]='leaf'}}slimes=[{x:22,y:11,vx:.02,vy:0,hp:3},{x:48,y:9,vx:-.02,vy:0,hp:3},{x:69,y:12,vx:.02,vy:0,hp:3}]}makeWorld();
let player={x:12,y:10,w:.72,h:1.5,vx:0,vy:0,hp:100,mp:100,on:false,face:1};
function solid(x,y){return x<0||x>=W||y>=H||y>=0&&types[world[y]?.[x]||'air']?.solid}function collide(x,y,w,h){for(let yy=Math.floor(y);yy<Math.ceil(y+h);yy++)for(let xx=Math.floor(x);xx<Math.ceil(x+w);xx++)if(solid(xx,yy))return true;return false}
function toast(s){let el=document.querySelector('#toast');el.textContent=s;el.classList.add('show');toastTimer=2}function addParticles(x,y,color){for(let i=0;i<8;i++)particles.push({x:x+.5,y:y+.5,vx:(Math.random()-.5)*.13,vy:(Math.random()-.8)*.13,life:.5,color})}
function mineOrPlace(){let wx=Math.floor((mouse.x+cam.x)/T),wy=Math.floor((mouse.y+cam.y)/T);if(wx<0||wy<0||wx>=W||wy>=H)return;let dist=Math.hypot(wx+.5-player.x,wy+.5-(player.y+0.7));if(dist>5)return toast('Too far away');if(mouse.button===2){if(world[wy][wx]==='air'&&items[selected].count>0&&items[selected].id!=='pick'){world[wy][wx]=items[selected].id;items[selected].count--;toast('Placed '+items[selected].name)}}else{let id=world[wy][wx];if(id!=='air'){world[wy][wx]='air';let it=items.find(i=>i.id===id);if(it)it.count++;addParticles(wx,wy,types[id].color);toast('Collected '+id)}}renderHotbar()}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key>='1'&&e.key<='5'){selected=+e.key-1;renderHotbar()}if(e.key.toLowerCase()==='e')toast('Crafting: collect 6 wood + 10 stone to upgrade your pick');if(e.key===' ')e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);c.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});c.addEventListener('mousedown',e=>{mouse.down=true;mouse.button=e.button;mineOrPlace()});c.addEventListener('mouseup',()=>mouse.down=false);c.addEventListener('contextmenu',e=>e.preventDefault());
function update(dt){time+=dt;let left=keys.a||keys.arrowleft,right=keys.d||keys.arrowright,jump=keys.w||keys.arrowup||keys[' '];player.vx+=(right-left)*.018;player.vx*=.84;if(Math.abs(player.vx)>.01)player.face=Math.sign(player.vx);if(jump&&player.on){player.vy=-.19;player.on=false}player.vy=Math.min(.25,player.vy+.009);let nx=player.x+player.vx;if(!collide(nx,player.y,player.w,player.h))player.x=nx;else player.vx=0;let ny=player.y+player.vy;if(!collide(player.x,ny,player.w,player.h)){player.y=ny;player.on=false}else{if(player.vy>0)player.on=true;player.vy=0}player.x=Math.max(1,Math.min(W-2,player.x));cam.x+=(player.x*T-innerWidth/2-cam.x)*.12;cam.y+=(player.y*T-innerHeight*.52-cam.y)*.12;cam.x=Math.max(0,Math.min(W*T-innerWidth,cam.x));cam.y=Math.max(0,Math.min(H*T-innerHeight,cam.y));for(const s of slimes){s.vy=Math.min(.2,s.vy+.008);s.vx+=(player.x>s.x?.002:-.002);s.vx*=.98;if(Math.abs(player.x-s.x)<8&&Math.random()<.008)s.vy=-.15;let sx=s.x+s.vx;if(!collide(sx,s.y,.8,.7))s.x=sx;else s.vx*=-1;let sy=s.y+s.vy;if(!collide(s.x,sy,.8,.7))s.y=sy;else{s.y=Math.floor(s.y);s.vy=-.12}if(Math.abs(player.x-s.x)<.8&&Math.abs(player.y-s.y)<1)player.hp=Math.max(0,player.hp-dt*8)}for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.006;p.life-=dt}particles=particles.filter(p=>p.life>0);if(mouse.down&&mouse.button===0&&time%0.18<dt)mineOrPlace();if(toastTimer>0&&(toastTimer-=dt)<=0)document.querySelector('#toast').classList.remove('show');document.querySelector('#hp').style.width=player.hp+'%';document.querySelector('#mp').style.width=(50+Math.sin(time)*20)+'%';document.querySelector('#clock').textContent='DAY 1 · '+String(8+Math.floor(time/12)%12).padStart(2,'0')+':'+String(Math.floor(time*5)%60).padStart(2,'0')}
function drawTile(id,x,y){let px=x*T-cam.x,py=y*T-cam.y;if(id==='air')return;let t=types[id];ctx.fillStyle=t.color;ctx.fillRect(px,py,T,T);ctx.fillStyle='#0002';ctx.fillRect(px,py+T-3,T,3);if(id==='grass'){ctx.fillStyle=t.top;ctx.fillRect(px,py,T,6);ctx.fillStyle='#b1ed7b88';ctx.fillRect(px+5,py+4,2,5);ctx.fillRect(px+20,py+3,2,6)}if(id==='stone'||id==='copper'||id==='crystal'){ctx.fillStyle=id==='crystal'?'#c3ffffaa':'#fff2';ctx.fillRect(px+7+(x*3%12),py+9,4,4);ctx.fillRect(px+21,py+22,3,3)}if(id==='wood'){ctx.fillStyle='#5f3d34';ctx.fillRect(px+9,py,4,T)}if(id==='leaf'){ctx.fillStyle='#8eea7b55';ctx.fillRect(px+5,py+6,8,5)}}
function drawPlayer(){let x=player.x*T-cam.x,y=player.y*T-cam.y;ctx.save();ctx.translate(x+T*.36,y+T*.76);ctx.scale(player.face,1);let bob=player.on?Math.sin(time*10)*1.5:0;ctx.fillStyle='#222b49';ctx.fillRect(-9,-4+bob,18,20);ctx.fillStyle='#f2b27d';ctx.fillRect(-8,-20+bob,16,15);ctx.fillStyle='#d95c55';ctx.fillRect(-10,-22+bob,20,6);ctx.fillStyle='#77c7ff';ctx.fillRect(-5,-13+bob,4,3);ctx.fillStyle='#ffc45f';ctx.fillRect(-10,15+bob,7,4);ctx.fillRect(3,15+bob,7,4);ctx.restore()}
function draw(){let sky=ctx.createLinearGradient(0,0,0,innerHeight);sky.addColorStop(0,'#101d46');sky.addColorStop(1,'#274b62');ctx.fillStyle=sky;ctx.fillRect(0,0,innerWidth,innerHeight);let night=(Math.sin(time/12)*.5+.5);ctx.fillStyle=`rgba(8,10,28,${night*.42})`;ctx.fillRect(0,0,innerWidth,innerHeight);for(let y=0;y<H;y++)for(let x=0;x<W;x++)drawTile(world[y][x],x,y);for(const s of slimes){let x=s.x*T-cam.x,y=s.y*T-cam.y;ctx.fillStyle='#83e5bd';ctx.beginPath();ctx.ellipse(x+13,y+20,13,11,0,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#172e4c';ctx.fillRect(x+8,y+15,3,4);ctx.fillRect(x+17,y+15,3,4)}drawPlayer();for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(p.x*T-cam.x,p.y*T-cam.y,4,4)}ctx.globalAlpha=1;let tx=Math.floor((mouse.x+cam.x)/T),ty=Math.floor((mouse.y+cam.y)/T);if(tx>=0&&ty>=0&&tx<W&&ty<H){ctx.strokeStyle='#fff9';ctx.lineWidth=2;ctx.strokeRect(tx*T-cam.x+2,ty*T-cam.y+2,T-4,T-4)}}
function renderHotbar(){document.querySelector('#hotbar').innerHTML=items.map((i,n)=>`<div class="slot ${n===selected?'sel':''}">${i.icon}<b>${i.count}</b></div>`).join('')}renderHotbar();let last=performance.now();function loop(now){let dt=Math.min(.04,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
